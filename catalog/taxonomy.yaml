# Taxonomía de ecopy: dominios → categorías, y tags de vocabulario controlado.
# Los slugs son identificadores estables: cambiar una etiqueta no rompe URLs ni históricos.
# Cada librería tiene exactamente una categoría (las cuotas suman 100 %); los tags solo navegan.

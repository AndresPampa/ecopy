# Actualización diaria: ingesta, build, commit de datos y deploy a Cloudflare Pages.
# Las estrellas de GitHub van los lunes: su serie es semanal y una corrida gasta unas 916 de las
# 1.000 consultas por hora del GITHUB_TOKEN.
name: update

on:
  schedule:
    - cron: "23 5 * * *"
    - cron: "53 6 * * 1"
  workflow_dispatch:
    inputs:
      stars:
        description: "También actualizar estrellas de GitHub"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  update:
    # Un `workflow_dispatch` desde otra rama no publica: ni datos en `main` ni deploy.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    outputs:
      ingest: ${{ steps.ingest.outcome }}
      stars: ${{ steps.stars.outcome }}
    steps:
      # Siempre `main`, y sin dejar el token en .git/config: solo lo recibe el paso del push.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.19"
          enable-cache: false
      - run: uv sync --locked --python 3.12
      # Si la ingesta falla, su corrida queda registrada y el sitio se publica igual con el aviso
      # "Actualización fallida"; el job `report` marca la ejecución como fallida.
      - id: ingest
        run: uv run ecopy ingest
        continue-on-error: true
      - id: stars
        if: github.event.schedule == '53 6 * * 1' || inputs.stars
        # Corta sola a los 25 min y guarda lo terminado; el timeout del paso es la red de abajo.
        run: uv run ecopy stars --budget 950 --max-minutes 25
        timeout-minutes: 30
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: uv run ecopy build
      - name: Commit de datos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "sin datos nuevos"
          else
            git commit -m "data: actualización $(date -u +%F)"
            git pull --rebase "$REMOTE" main
            # Solo sale el commit de datos (`git add data`): cualquier otro commit corta acá.
            test "$(git rev-list --count FETCH_HEAD..HEAD)" -eq 1
            git push "$REMOTE" HEAD:main
          fi
        env:
          REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: build/site
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: update
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    permissions:
      actions: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: site
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.153.0"
          command: pages deploy site --project-name=ecopy --branch=main

  report:
    needs: [update, deploy]
    if: always() && (needs.update.outputs.ingest == 'failure' || needs.update.outputs.stars == 'failure')
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - run: |
          echo "ingesta: ${INGEST}; estrellas: ${STARS}. El sitio se publicó con los últimos datos buenos."
          exit 1
        env:
          INGEST: ${{ needs.update.outputs.ingest }}
          STARS: ${{ needs.update.outputs.stars }}

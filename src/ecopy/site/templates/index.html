{% extends "_base.html" %}
{%- block title %}{{ t.years_title }}{% endblock %}
{%- block content %}
<nav><a href="/{{ other }}/" hreflang="{{ other }}">{{ t.switch_label }}</a></nav>
<h1>{{ t.years_title }}</h1>
<ul>
{%- for item in years|reverse %}
<li><a href="/{{ lang }}/year/{{ item.year }}/">{{ item.year }}</a>{% if item.status == "ytd" %} · {{ t.ytd }}{% endif %}</li>
{%- endfor %}
</ul>
{%- endblock %}
